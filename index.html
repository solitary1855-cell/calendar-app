<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="日子">
<meta name="theme-color" content="#FFFFFF">
<title>日子 · 行事曆</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
/* ===== 第三版：清爽彩色條 ===== */
:root{
  --bg:#FFFFFF; --paper:#FFFFFF; --paper2:#F5F6F8; --ink:#2F3337; --sub:#8A9099; --faint:#C2C7CE; --line:#EDEFF2;
  --red:#EE5A5A; --blue:#3D8BFD; --rose:var(--red); --accent:var(--blue);
  --round:"Huninn","PingFang TC","Noto Sans TC",-apple-system,sans-serif; --hand:var(--round); --serif:var(--round); --sans:var(--round);
  --shadow:0 4px 18px rgba(30,40,60,.08); --hour:46px; --tabh:64px;
  --card:#FFFFFF; --tabbg:rgba(255,255,255,.96); --selbg:#F3F7FF; --todaycol:#F7FAFF; --delbg:#FFF2F2; --dropbg:#E6F0FF; --mask:rgba(20,25,35,.3);
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#141619; --paper:#1D2024; --paper2:#272B30; --ink:#E7E9EC; --sub:#9AA2AB; --faint:#5E656E; --line:#2A2E34;
  --blue:#5A9BFF; --red:#FF7070;
  --card:#1D2024; --tabbg:rgba(22,24,28,.95); --selbg:#1E2838; --todaycol:#19202B; --delbg:#3A2326; --dropbg:#22364F; --mask:rgba(0,0,0,.55);
  --shadow:0 4px 18px rgba(0,0,0,.35); color-scheme:dark;
}
html{transition:background .25s}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--round);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font-family:inherit;color:var(--ink);font-size:16px}
#app{max-width:1100px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 8px) calc(env(safe-area-inset-bottom) + var(--tabh) + 14px) calc(env(safe-area-inset-left) + 8px)}

/* 頂部 */
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 6px 8px}
.title{display:flex;align-items:center;gap:2px;min-width:0}
.title .big{font-size:22px;font-weight:400;letter-spacing:.02em;white-space:nowrap}
.title .big .yr{font-size:22px;margin-left:4px}
.title .big::after{content:" ▾";font-size:13px;color:var(--sub)}
.title .small{font-size:11px;color:var(--sub);letter-spacing:.06em;white-space:nowrap}
.hbtns{display:flex;gap:4px;align-items:center}
.ibtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:var(--sub)}
.ibtn:active{background:var(--paper2)}
.today-btn{white-space:nowrap;font-size:13px;padding:6px 12px;border-radius:16px;background:var(--paper2);color:var(--ink)}
.add-btn{position:fixed;right:calc(env(safe-area-inset-right) + 18px);bottom:calc(env(safe-area-inset-bottom) + var(--tabh) + 16px);z-index:15;
  width:54px;height:54px;border-radius:50%;background:var(--blue);color:#fff;font-size:28px;font-weight:300;display:grid;place-items:center;box-shadow:0 6px 18px rgba(61,139,253,.4)}
.add-btn:active{transform:scale(.94)}
.greet,.foot{display:none}

/* 底部分頁列 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:14;display:flex;justify-content:space-around;background:var(--tabbg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);height:calc(var(--tabh) + env(safe-area-inset-bottom));padding:6px 8px env(safe-area-inset-bottom)}
.tabs button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--faint);padding-top:4px}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--blue)}

/* 倒數 D-day 卡 */
.cd-strip{display:flex;gap:10px;overflow-x:auto;padding:4px 4px 12px;scrollbar-width:none}
.cd-strip::-webkit-scrollbar{display:none}
.cd{flex:0 0 auto;min-width:132px;background:var(--card);border-radius:16px;padding:10px 14px 10px;box-shadow:var(--shadow);border:1px solid var(--line);cursor:pointer;position:relative}
.cd .lbl{font-size:13px;color:var(--ink);display:flex;align-items:center;gap:6px;white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.cd .lbl::before{content:"";flex:0 0 8px;height:8px;border-radius:3px;background:var(--c)}
.cd .num{font-size:24px;font-weight:400;color:var(--c);text-align:right;margin-top:6px;line-height:1.1;letter-spacing:.02em}
.cd .dt{font-size:11px;color:var(--sub)}

.card{background:var(--card);border-radius:0;overflow:hidden}
main{flex:1;display:flex;flex-direction:column;gap:10px}

/* 月曆 */
.wk-head{display:grid;grid-template-columns:repeat(7,1fr);padding:4px 0 6px;font-size:12px;color:var(--sub);text-align:center}
.wk-head .sun{color:var(--red)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(var(--rowh,96px),auto)}
.mcell{border-top:1px solid var(--line);padding:3px 1px 2px;display:flex;flex-direction:column;cursor:pointer;overflow:hidden;min-width:0}
.mcell.other>*{opacity:.35}
.mcell.sel{background:var(--selbg)}
.mcell .dn{align-self:center;font-size:13px;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;line-height:1;margin-bottom:1px}
.mcell.hol .dn,.mcell.sun .dn{color:var(--red)}
.mcell.today .dn{background:var(--blue);color:#fff}
.mcell .ln{text-align:center;font-size:9px;color:var(--faint);white-space:nowrap;overflow:hidden;margin-bottom:2px}
.mcell.hol .ln{color:var(--red)}
.bar{font-size:10px;line-height:16px;padding:0 3px;margin:1px 1px;border-radius:3px;white-space:nowrap;overflow:hidden;background:var(--c);color:var(--f,#fff)}
.bar.ms{background:none;color:var(--c);font-size:9.5px;line-height:13px;border-bottom:1.5px solid var(--c);border-radius:0;padding:0 1px}
.more{font-size:9.5px;color:var(--sub);text-align:center}

/* 當日 */
.agenda{padding:14px 12px 8px;border-top:6px solid var(--paper2)}
.agenda h3{margin:0 0 6px;font-size:16px;font-weight:400;display:flex;align-items:baseline;gap:8px}
.agenda h3 span{font-size:12px;color:var(--sub)}
.item{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;align-items:stretch}
.item:last-child{border-bottom:0}
.item .tm{width:44px;flex:0 0 44px;font-size:11px;color:var(--sub);line-height:1.5;text-align:right}
.item .tm b{display:block;font-weight:400;color:var(--ink);font-size:13px}
.item .cl{width:4px;border-radius:3px;background:var(--c);flex:0 0 4px}
.item .tx{flex:1;min-width:0}
.item .tt{font-size:15px;line-height:1.4}
.item .meta{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tag{font-size:10px;color:#fff;background:var(--c);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.empty{color:var(--faint);font-size:13px;padding:16px 0 12px;text-align:center}

/* 時間格 */
.tg-wrap{display:flex;flex-direction:column}
.tg-head{display:grid;border-bottom:1px solid var(--line);padding:4px 0 6px}
.tg-head .c{text-align:center;cursor:pointer}
.tg-head .w{font-size:11px;color:var(--sub)}
.tg-head .d{font-size:16px;width:28px;height:28px;margin:2px auto 0;display:grid;place-items:center;border-radius:50%}
.tg-head .c.hol .d,.tg-head .c.sun .d,.tg-head .c.sun .w{color:var(--red)}
.tg-head .c.today .d{background:var(--blue);color:#fff}
.tg-head .l{font-size:9px;color:var(--faint);white-space:nowrap;overflow:hidden}
.tg-head .c.hol .l{color:var(--red)}
.allday{display:grid;border-bottom:1px solid var(--line);min-height:22px}
.allday .lab{font-size:10px;color:var(--faint);text-align:right;padding:4px 6px 0 0}
.allday .col{padding:2px 0;border-left:1px solid var(--line);min-width:0}
.tg-scroll{overflow-y:auto;height:calc(100vh - 250px);min-height:360px;-webkit-overflow-scrolling:touch}
.tg{display:grid;position:relative}
.tg .hours div{height:var(--hour);font-size:10px;color:var(--faint);text-align:right;padding-right:6px;transform:translateY(-6px)}
.tg .col{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--hour)}
.tg .col.today{background-color:var(--todaycol)}
.ev{position:absolute;border-radius:5px;padding:3px 4px;font-size:11px;line-height:1.3;overflow:hidden;background:var(--c);color:var(--f,#fff);cursor:pointer}
.ev .s{opacity:.85;font-size:10px}
.nowline{position:absolute;left:0;right:0;height:0;border-top:1.5px solid var(--red);z-index:3}
.nowline::before{content:"";position:absolute;left:-4px;top:-4.5px;width:7px;height:7px;border-radius:50%;background:var(--red)}

/* 清單 */
.list{padding:0 10px 10px}
.list .dh{display:flex;align-items:baseline;gap:8px;padding:14px 0 4px;border-bottom:1px solid var(--line)}
.list .dh .n{font-size:20px;width:30px}
.list .dh .w{font-size:12px;color:var(--sub)}
.list .dh .h{font-size:11px;color:var(--red);margin-left:auto}
.list .dh.today .n{color:var(--blue)}
.list .mh{font-size:14px;color:var(--sub);padding:18px 0 0}

/* 表單 */
.mask{position:fixed;inset:0;background:var(--mask);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;
  padding:8px 18px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s;z-index:21;box-shadow:0 -8px 30px rgba(20,25,35,.15)}
.sheet.on{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
@media (min-width:700px){.sheet{bottom:50%;border-radius:20px;transform:translateY(60%) scale(.96);opacity:0;transition:all .25s}.sheet.on{transform:translateY(50%);opacity:1;visibility:visible}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sh-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sh-top h2{font-weight:400;font-size:18px;margin:0}
.txtbtn{font-size:15px;color:var(--sub);padding:6px 4px}
.txtbtn.pri{color:#fff;background:var(--blue);padding:7px 16px;border-radius:18px}
.f{margin:10px 0}
.f label.l{display:block;font-size:12px;color:var(--sub);margin-bottom:6px}
.inp{width:100%;border:1px solid var(--line);background:var(--paper2);border-radius:10px;padding:10px 12px;outline:none;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:var(--blue)}
.inp.title-inp{font-size:20px;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 2px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
textarea.inp{min-height:70px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border-radius:16px;font-size:13px;border:1px solid var(--line);color:var(--sub);display:flex;align-items:center;gap:6px}
.chip i{width:10px;height:10px;border-radius:3px;background:var(--c);display:inline-block}
.chip.on{border-color:var(--c,var(--blue));background:var(--c,var(--blue));color:var(--f,#fff)}
.chip.on i{background:rgba(255,255,255,.8)}
.switch{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.switch span{font-size:14px}
.tog{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .2s;flex:0 0 46px}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tog.on{background:var(--blue)}
.tog.on::after{left:21px}
.wds{display:flex;gap:6px;margin-top:8px}
.wds button{flex:1;height:34px;border-radius:8px;border:1px solid var(--line);font-size:13px;color:var(--sub)}
.wds button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.del{width:100%;margin-top:16px;padding:12px;border-radius:12px;color:var(--red);background:var(--delbg);font-size:15px}
.hint{font-size:12px;color:var(--sub);line-height:1.7}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px}
.setrow:last-child{border-bottom:0}
.setrow button.txtbtn{color:var(--blue)}
.toast{pointer-events:none;position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-120px);background:#2F3337;color:#fff;padding:10px 18px;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.25);font-size:14px;z-index:40;transition:transform .3s;max-width:90vw}
.toast.on{transform:translate(-50%,0)}

@media (min-width:700px){
  .mcell{padding:4px 3px}
  .mcell .dn{font-size:15px;width:28px;height:28px}
  .bar{font-size:12px;line-height:19px;padding:0 5px}
  .mcell .ln{font-size:10.5px}
  .ev{font-size:12px}
  .month-layout{display:grid;grid-template-columns:1fr 300px;gap:0;align-items:start}
  .month-layout .agenda{border-top:0;border-left:1px solid var(--line);min-height:100%}
}
/* 分類 */
.chip.addchip{border-style:dashed;color:var(--blue);border-color:var(--blue)}
.catnew{margin-top:10px;padding:12px;border-radius:14px;background:var(--paper2)}
.cdot{width:22px;height:22px;flex:0 0 22px!important;border-radius:7px;background:var(--c);display:inline-block}
.cdot.big{width:30px;height:30px;flex:0 0 30px!important;border-radius:9px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sw{width:30px;height:30px;border-radius:50%;background:var(--c);position:relative;flex:0 0 30px}
.sw.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2.5px solid var(--c)}
.sw.custom{background:conic-gradient(#F28B8B,#F6CD5C,#9BC26B,#4FB8C9,#6E95CF,#B08DDB,#F28B8B);overflow:visible;cursor:pointer}
.sw.custom.on{background:var(--c)}
.sw.custom.on::after{border-color:var(--c)}
.sw.custom::before{content:"＋";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:14px;text-shadow:0 0 3px rgba(0,0,0,.4)}
.sw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.catrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.catrow .catname{flex:1;min-width:0;padding:8px 10px}
.catrow .cnt{font-size:12px;color:var(--sub);flex:0 0 auto}
.catrow .catdel{width:30px;height:30px;border-radius:50%;color:var(--sub);flex:0 0 30px}
.catrow .catpick,.catrow .catconfirm{flex:0 0 100%}
.catrow .catconfirm{background:var(--delbg);border-radius:12px;padding:10px 12px}
.addcat{width:100%;margin-top:12px;padding:12px;border-radius:12px;border:1.5px dashed var(--blue);color:var(--blue);font-size:15px}
/* 待辦 */
.todo-add{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow);margin:2px 2px 4px}
.todo-add .row1{display:flex;align-items:center;gap:8px}
.todo-add .plus{width:26px;height:26px;border-radius:50%;border:2px dashed var(--faint);flex:0 0 26px}
.todo-add input.q{flex:1;border:0;outline:none;background:none;font-size:16px;padding:8px 0;min-width:0}
.todo-add .addbtn{background:var(--blue);color:#fff;border-radius:14px;padding:6px 14px;font-size:14px}
.dl-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.dl-chips .lab{font-size:12px;color:var(--sub);margin-right:2px}
.dl-chips button{font-size:12px;padding:4px 10px;border-radius:12px;border:1px solid var(--line);color:var(--sub)}
.dl-chips button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.dl-chips input[type=date]{font-size:13px;padding:3px 6px;border:1px solid var(--line);border-radius:8px;background:var(--paper2);color:var(--ink)}
.todo-list{padding:2px 12px 10px}
.td-sec{font-size:13px;color:var(--sub);padding:16px 2px 4px;display:flex;align-items:center;gap:6px}
.td-sec.red{color:var(--red)}
.td-sec .n{font-size:11px;background:var(--paper2);border-radius:8px;padding:0 6px}
.td{display:flex;align-items:flex-start;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.td:last-child{border-bottom:0}
.ck{width:22px;height:22px;flex:0 0 22px;border-radius:6px;border:2px solid var(--faint);margin-top:1px;display:grid;place-items:center;transition:all .15s}
.ck.on{background:var(--blue);border-color:var(--blue)}
.ck.on::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.td .tx{flex:1;min-width:0;cursor:pointer}
.td .tt{font-size:15px;line-height:1.45;word-break:break-word}
.td.done .tt{color:var(--faint);text-decoration:line-through}
.td .due{font-size:12px;color:var(--sub);margin-top:2px}
.td .due.over{color:var(--red)} .td .due.today{color:var(--blue)}
.td .note{font-size:12px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td-more{display:block;width:100%;text-align:center;font-size:13px;color:var(--blue);padding:12px 0 4px}
.tdbar{font-size:9.5px;line-height:14px;color:var(--ink);white-space:nowrap;overflow:hidden;padding:0 2px;margin:1px 0}
.tdbar.done{color:var(--faint);text-decoration:line-through}
.tdbar.over{color:var(--red)}
.agenda .td{padding:9px 4px}
@media (min-width:700px){.tdbar{font-size:11.5px;line-height:17px}}
[data-eid]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.drag-src{opacity:.3}
.drag-ghost{position:fixed!important;z-index:50;pointer-events:none;transform:scale(1.06) rotate(-2deg);box-shadow:0 10px 24px rgba(20,30,50,.28);opacity:.95;transition:none}
.drop-cell{background:var(--dropbg)!important;box-shadow:inset 0 0 0 2px var(--blue)}
.drop-slot{position:absolute;left:1px;right:2px;border-radius:5px;border:2px dashed var(--blue);background:rgba(61,139,253,.12);z-index:4;font-size:11px;color:var(--blue);padding:2px 4px;pointer-events:none}
body.dragging{-webkit-user-select:none;user-select:none;cursor:grabbing}
</style>

</head>
<body>
<div id="app">
  <header>
    <div class="title" id="titleBox">
      <button class="ibtn" id="prev" aria-label="上一頁">‹</button>
      <div><div class="big" id="tBig"></div><div class="small" id="tSmall"></div></div>
      <button class="ibtn" id="next" aria-label="下一頁">›</button>
    </div>
    <div class="hbtns">
      <button class="today-btn" id="todayBtn">今天</button>
      <button class="ibtn" id="themeBtn" aria-label="切換深淺色"></button>
      <button class="ibtn" id="setBtn" aria-label="設定">⚙︎</button>
      <button class="add-btn" id="addBtn" aria-label="新增">＋</button>
    </div>
  </header>
  <div class="greet" id="greet"></div>

/* ========= 基本資料 ========= */

function fgFor(hex){ const n=parseInt(hex.slice(1),16), r=n>>16&255, g=n>>8&255, b=n&255; return (0.299*r+0.587*g+0.114*b)/255>0.68?'#3A3A2A':'#fff'; }
const catOf = id => { const c = CATS.find(c=>c.id===id) || CATS[0] || {id:'none',name:'未分類',c:'#90A4AE'}; return {...c, f:fgFor(c.c)}; };
// 台灣國定假日（行政院人事行政總處公告，2026–2027）
const HOL = {"20260101":"開國紀念日","20260215":"小年夜","20260216":"農曆除夕","20260217":"春節","20260218":"春節","20260219":"春節","20260220":"補假","20260227":"補假","20260228":"和平紀念日","20260403":"補假","20260404":"兒童節","20260405":"清明節","20260406":"補假","20260501":"勞動節","20260619":"端午節","20260925":"中秋節","20260928":"教師節","20261009":"補假","20261010":"國慶日","20261025":"光復節","20261026":"補假","20261225":"行憲紀念日","20270101":"開國紀念日","20270204":"小年夜","20270205":"農曆除夕","20270206":"春節","20270207":"春節","20270208":"春節","20270209":"補假","20270210":"補假","20270228":"和平紀念日","20270301":"補假","20270404":"兒童節","20270405":"清明節","20270406":"補假","20270430":"補假","20270501":"勞動節","20270609":"端午節","20270915":"中秋節","20270928":"教師節","20271010":"國慶日","20271011":"補假","20271025":"光復節","20271224":"補假","20271225":"行憲紀念日","20271231":"補假"};
// 每年固定的國定紀念日（沒有公告資料的年份用這份）
const FIXED_HOL = {"0101":"元旦","0228":"和平紀念日","0404":"兒童節","0501":"勞動節","0928":"教師節","1010":"國慶日","1025":"光復節","1225":"行憲紀念日"};
const LUNAR_FEST = {"正月1":"春節","正月15":"元宵","五月5":"端午","七月7":"七夕","七月15":"中元","八月15":"中秋","九月9":"重陽","臘月8":"臘八"};
const WD = ['日','一','二','三','四','五','六'];
const EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MN = ['一','二','三','四','五','六','七','八','九','十','十一','十二'];

/* ========= 日期工具 ========= */
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const sameDay = (a,b) => ymd(a)===ymd(b);
const toMin = t => { if(!t) return 0; const [h,m]=t.split(':').map(Number); return h*60+m; };
const diffDays = (a,b) => Math.round((parse(ymd(b))-parse(ymd(a)))/86400000);

const lunarFmt = new Intl.DateTimeFormat('zh-TW-u-ca-chinese',{month:'long',day:'numeric'});
const yearFmt = new Intl.DateTimeFormat('zh-TW-u-ca-chinese',{year:'numeric'});
const LD = ['','初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
const lunarCache = {};
function lunar(d){
  const k = ymd(d); if(lunarCache[k]) return lunarCache[k];
  let r = {m:'',d:0,text:'',fest:''};
  try{
    const p = lunarFmt.formatToParts(new Date(d.getFullYear(),d.getMonth(),d.getDate(),12));
    r.m = (p.find(x=>x.type==='month')||{}).value||''; r.d = +((p.find(x=>x.type==='day')||{}).value||0);
    r.text = r.d===1 ? r.m : LD[r.d];
    r.fest = LUNAR_FEST[r.m+r.d]||'';
  }catch(e){}
  return lunarCache[k]=r;
}
function ganzhiYear(d){ try{ const s=yearFmt.format(d); const m=s.match(/[甲乙丙丁戊己庚辛壬癸][子丑寅卯辰巳午未申酉戌亥]/); return m?m[0]+'年':''; }catch(e){return ''} }
function holiday(d){
  const k = ymd(d).replace(/-/g,'');
  if(HOL[k]) return HOL[k];
  const y = d.getFullYear();
  if(y<2026 || y>2027){ const f = FIXED_HOL[k.slice(4)]; if(f) return f; }
  return '';
}
function dayLabel(d){ // 月曆格子下方的小字：假日 > 農曆節日 > 農曆日期
  const h = holiday(d); if(h) return {t:h, hol:true};
  const l = lunar(d); if(l.fest) return {t:l.fest, hol:false, first:true};
  return {t:l.text, hol:false, first:l.d===1};
}

/* ========= 資料儲存 ========= */
const KEY='hizi.events.v1', SKEY='hizi.settings.v1', FKEY='hizi.fired.v1';

function syncCats(){ if(!Array.isArray(settings.cats)||!settings.cats.length) settings.cats = DEFAULT_CATS.map(c=>({id:c.id,name:c.name,c:c.c})); CATS = settings.cats; }
syncCats();
function load(k,def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(events)); localStorage.setItem(SKEY, JSON.stringify(settings)); }catch(e){ toast('儲存失敗：瀏覽器空間不足'); } }
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const TKEY='hizi.todos.v1';
let todos = load(TKEY, null);
if(!events){ events = demoEvents(); save(); }
if(!todos){ const t=new Date(), d=n=>ymd(addDays(t,n));
  todos=[{id:uid(),text:'回覆業主變更設計的 email',due:d(0),time:'',done:false,created:Date.now(),demo:1},
         {id:uid(),text:'整理投標文件、押標金',due:d(4),time:'17:00',done:false,created:Date.now()+1,demo:1},

         {id:uid(),text:'買孩子的美勞材料',due:null,time:'',done:false,created:Date.now()+3,demo:1},
         {id:uid(),text:'換機車機油',due:null,time:'',done:true,doneAt:Date.now(),created:Date.now()+4,demo:1}];
  saveTodos(); }
function saveTodos(){ try{ localStorage.setItem(TKEY, JSON.stringify(todos)); }catch(e){ toast('儲存失敗'); } }
const todosOn = d => { const k=ymd(d); return todos.filter(x=>x.due===k).sort((a,b)=>a.done-b.done||(a.time||'99').localeCompare(b.time||'99')); };

    {id:uid(),demo:1,title:'結構計算書送審',date:d(3),start:'14:00',end:'15:00',location:'業主辦公室',cat:'work',repeat:{type:'none'},kind:'milestone',remind:1440},

    {id:uid(),demo:1,title:'看牙醫',date:d(5),start:'10:00',end:'11:00',location:'',cat:'life',repeat:{type:'none'},kind:'normal',remind:120},

/* ========= 深色／淺色 ========= */
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
function isDark(){ return settings.theme==='dark' || (settings.theme==='auto' && darkMQ.matches); }
function applyTheme(){
  const dk=isDark(); document.documentElement.dataset.theme = dk?'dark':'light';
  document.querySelector('meta[name=theme-color]').setAttribute('content', dk?'#141619':'#FFFFFF');
  const b=document.getElementById('themeBtn');
  if(b) b.innerHTML = dk
    ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>'
    : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
}
darkMQ.addEventListener && darkMQ.addEventListener('change',()=>{ if(settings.theme==='auto') applyTheme(); });
applyTheme();

/* ========= 重複事件展開 ========= */
function occursOn(ev, d){
  const k = ymd(d);
  if(k < ev.date) return false;
  const r = ev.repeat || {type:'none'};
  if(r.until && k > r.until) return false;
  if(ev.ex && ev.ex.includes(k)) return false;
  const s = parse(ev.date);
  switch(r.type){
    case 'daily': return true;
    case 'weekly': { const days = (r.days&&r.days.length)?r.days:[s.getDay()]; return days.includes(d.getDay()); }
    case 'monthly': return d.getDate()===s.getDate();
    case 'yearly': return d.getDate()===s.getDate() && d.getMonth()===s.getMonth();
    default: return k===ev.date;
  }
}
function eventsOn(d){
  return events.filter(e=>occursOn(e,d)).sort((a,b)=>{
    if(!!b.allDay - !!a.allDay) return (!!b.allDay - !!a.allDay);
    return toMin(a.start)-toMin(b.start);
  });
}
function nextOccurrence(ev, from){
  for(let i=0;i<800;i++){ const d=addDays(from,i); if(occursOn(ev,d)) return d; }
  return null;
}

/* ========= 狀態 ========= */
let view = load('hizi.view','month');
let cur = new Date(); cur.setHours(0,0,0,0);
let sel = new Date(cur);
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = () => { const t=new Date(); t.setHours(0,0,0,0); return t; };

function weekStartOf(d){ const x=new Date(d); const off=(x.getDay()-settings.weekStart+7)%7; return addDays(x,-off); }

/* ========= 畫面 ========= */
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.v===view));
  renderTitle(); renderGreet(); renderCountdown();
  const m = $('#main');
  if(view==='month') m.innerHTML = monthHTML();
  else if(view==='week') m.innerHTML = gridHTML(7);
  else if(view==='day') m.innerHTML = gridHTML(1);
  else if(view==='list') m.innerHTML = listHTML();
  else if(view==='tt') m.innerHTML = ttHTML();
  else if(view==='todo') m.innerHTML = todoHTML();
  bindMain(); bindTodos();
  if(view==='month'){ const g=$('#mgrid'); if(g){ const weeks=g.children.length/7; const top=g.getBoundingClientRect().top+scrollY; const avail=innerHeight-top-70-(innerWidth<700?0:0); g.style.setProperty('--rowh', Math.max(innerWidth>=700?100:82, Math.floor(avail/weeks))+'px'); } }
  if(view==='week'||view==='day'||view==='tt'){ const sc=$('.tg-scroll'); if(sc) sc.scrollTop = (7-6)*parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hour')); }
}
function renderTitle(){
  let big='', small='';
  const y = cur.getFullYear();
  if(view==='month'){ big = `${cur.getMonth()+1}月<span class="yr">${y}</span>`; small = `${ganzhiYear(new Date(y,cur.getMonth(),15))} · 農曆${lunar(new Date(y,cur.getMonth(),15)).m}`; }
  else if(view==='week'||view==='tt'){ const s=weekStartOf(cur), e=addDays(s,6); big=`${s.getMonth()+1}月<span class="yr">${s.getFullYear()}</span>`; small=`${s.getMonth()+1}/${s.getDate()} – ${e.getMonth()+1}/${e.getDate()}`; if(view==='tt'){big='課表'; small='孩子的一週';} }
  else if(view==='day'){ big = `${cur.getMonth()+1}/${cur.getDate()}`; const l=lunar(cur); small = `星期${WD[cur.getDay()]} · 農曆${l.m}${LD[l.d]}`; }
  else if(view==='todo'){ const n=todos.filter(x=>!x.done).length; big='待辦'; small = n?`還有 ${n} 件未完成`:'全部完成了 🎉'; }
  else { big='清單'; small='接下來 90 天'; }
  $('#tBig').innerHTML=big; $('#tSmall').textContent=small;
  const nav = view!=='list' && view!=='tt' && view!=='todo';
  $('#prev').style.visibility = $('#next').style.visibility = nav?'visible':'hidden';
}
const DOODLE=`<svg class="doodle" viewBox="0 0 40 40" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 36 C14 26 18 16 27 6" stroke="#93A88F" stroke-width="2"/><path d="M16 26 C10 25 7 20 8 15 C13 16 16 20 16 26Z" fill="#B9C9B4" stroke="#93A88F" stroke-width="1.6"/><path d="M20 18 C21 12 25 9 30 10 C29 15 25 18 20 18Z" fill="#E3C3BC" stroke="#C48C82" stroke-width="1.6"/><circle cx="31" cy="25" r="2.2" fill="#D2B47E"/></svg>`;
const QUOTES=['日 子 · 慢 慢 過','今 天 也 辛 苦 了','好 好 吃 飯 · 好 好 睡','一 步 一 步 來','留 點 時 間 給 自 己','把 日 子 過 成 詩'];
function renderGreet(){
  const h=new Date().getHours(), t=today();
  const hi = h<5?'夜深了':h<11?'早安':h<14?'午安':h<18?'下午好':'晚安';
  const left = eventsOn(t).filter(e=>e.allDay || toMin(e.end||e.start) > h*60+new Date().getMinutes()).length;
  $('#greet').innerHTML = DOODLE + (left ? `<span>${hi}，今天還有<b>${left}</b>件事</span>` : `<span>${hi}，今天的行程都完成了，放鬆一下吧</span>`);
  $('#foot').textContent = QUOTES[t.getDate()%QUOTES.length];
}
function renderCountdown(){
  const t = today(); const items=[];
  events.forEach(e=>{
    if(e.kind!=='countdown' && e.kind!=='milestone') return;
    const d = nextOccurrence(e,t); if(!d) return;
    const n = diffDays(t,d);
    if(e.kind==='milestone' && n>30) return; // 里程碑只顯示 30 天內
    items.push({e,d,n});
  });
  items.sort((a,b)=>a.n-b.n);
  const show = view==='list' && items.length;   // 月檢視不顯示倒數／里程碑卡片
  $('#cdStrip').style.display = show?'flex':'none';
  const STK=['#98AE95','#C79F98','#C9AE88','#8A9CAA','#A69BB6'];
  $('#cdStrip').innerHTML = items.slice(0,8).map(({e,d,n},i)=>`
    <div class="cd ${e.kind==='milestone'?'ms':''}" style="--c:${catOf(e.cat).c}" data-id="${e.id}" data-date="${ymd(d)}">
      <div class="lbl">${esc(e.title)}</div>
      <div class="num">${n===0?'D-Day':'D-'+n}</div>
      <div class="dt">${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} 週${WD[d.getDay()]}</div>
    </div>`).join('');
}

function barHTML(e,d){
  const k = catOf(e.cat), c=k.c, da = d?` data-eid="${e.id}" data-date="${ymd(d)}"`:'';
  if(e.kind==='milestone') return `<div class="bar ms" style="--c:${c}"${da}>◆${esc(e.title)}</div>`;
  return `<div class="bar" style="--c:${c};--f:${k.f}"${da}>${esc(e.title)}</div>`;
}
function monthHTML(){
  const y=cur.getFullYear(), mo=cur.getMonth();
  const first=new Date(y,mo,1), start=weekStartOf(first);
  const weeks = Math.ceil((diffDays(start,new Date(y,mo+1,0))+1)/7);
  const t=today();
  let head='', cells='';
  for(let i=0;i<7;i++){ const w=(settings.weekStart+i)%7; head+=`<div class="${w===0?'sun':''}">${WD[w]}</div>`; }
  const maxBars = innerWidth>=700?4:3;
  for(let i=0;i<weeks*7;i++){
    const d=addDays(start,i), lb=dayLabel(d), evs=eventsOn(d);
    const cls=['mcell']; if(d.getMonth()!==mo) cls.push('other'); if(sameDay(d,t)) cls.push('today'); if(sameDay(d,sel)) cls.push('sel');
    if(lb.hol) cls.push('hol'); if(d.getDay()===0) cls.push('sun'); if(d.getDay()===0||d.getDay()===6) cls.push('we');
    const tds = todosOn(d), tk = ymd(d)<ymd(t);
    const items = [...evs.map(e=>barHTML(e,d)), ...tds.map(x=>`<div class="tdbar ${x.done?'done':(tk?'over':'')}">${x.done?'☑':'☐'} ${esc(x.text)}</div>`)];
    const bars = items.slice(0,maxBars).join('') + (items.length>maxBars?`<div class="more">+${items.length-maxBars}</div>`:'');
    cells+=`<div class="${cls.join(' ')}" data-date="${ymd(d)}"><div class="dn">${d.getDate()}</div>${settings.lunar||lb.hol?`<div class="ln ${lb.first?'first':''}">${esc(lb.t)}</div>`:''}${bars}</div>`;
  }
  return `<div class="month-layout"><div class="card"><div class="wk-head">${head}</div><div class="mgrid" id="mgrid">${cells}</div></div>
    <div class="card agenda">${agendaHTML(sel)}</div></div>`;
}
function itemHTML(e,d){
  const c=catOf(e.cat);
  const tm = e.allDay?'<b>全天</b>':`<b>${e.start||''}</b>${e.end&&e.end!==e.start?e.end:''}`;
  const tag = e.kind==='milestone'?'<span class="tag">里程碑</span>':e.kind==='countdown'?'<span class="tag">倒數</span>':'';
  const rep = e.repeat&&e.repeat.type!=='none'?' ↻':'';
  const meta=[e.location?('⌖ '+esc(e.location)):'', e.note?esc(e.note):''].filter(Boolean).join('　');
  return `<div class="item" style="--c:${c.c}" data-id="${e.id}" data-date="${ymd(d)}"><div class="tm">${tm}</div><div class="cl"></div>
    <div class="tx"><div class="tt">${e.kind==='milestone'?'◆ ':''}${esc(e.title)}${tag}<span style="color:var(--faint);font-size:12px">${rep}</span></div>${meta?`<div class="meta">${meta}</div>`:''}</div></div>`;
}
function agendaHTML(d){
  const evs=eventsOn(d), h=holiday(d), l=lunar(d);
  return `<h3>${d.getMonth()+1}月${d.getDate()}日 星期${WD[d.getDay()]}<span>${h?h+' · ':''}農曆${l.m}${LD[l.d]}</span></h3>
    ${evs.length?evs.map(e=>itemHTML(e,d)).join(''):(todosOn(d).length?'':'<div class="empty">今天沒有安排，好好休息</div>')}
    ${todosOn(d).length?`<div class="td-sec">待辦</div>${todosOn(d).map(todoItemHTML).join('')}`:''}`;
}

function layoutDay(evs){ // 重疊事件並排
  const items = evs.filter(e=>!e.allDay).map(e=>({e,s:toMin(e.start),en:Math.max(toMin(e.end||e.start),toMin(e.start)+30)})).sort((a,b)=>a.s-b.s||b.en-a.en);
  let groups=[], g=[], gEnd=-1;
  items.forEach(it=>{ if(it.s>=gEnd && g.length){groups.push(g); g=[];} g.push(it); gEnd=Math.max(gEnd,it.en); if(g.length===1) gEnd=it.en; });
  if(g.length) groups.push(g);
  groups.forEach(gr=>{ const cols=[]; gr.forEach(it=>{ let i=cols.findIndex(end=>end<=it.s); if(i<0){i=cols.length;cols.push(0);} cols[i]=it.en; it.col=i; }); gr.forEach(it=>it.n=cols.length); });
  return items;
}
function gridHTML(n, filterCat){
  const H=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hour'));
  const startH=6, endH=24, t=today();
  const days = n===1?[cur]:Array.from({length:7},(_,i)=>addDays(weekStartOf(cur),i));
  const cols = `38px repeat(${days.length},minmax(0,1fr))`;
  let head='<div></div>', all='<div class="lab">全天</div>', body='';
  let hours=''; for(let h=startH;h<endH;h++) hours+=`<div>${h===startH?'':h+':00'}</div>`;
  days.forEach(d=>{
    const lb=dayLabel(d);
    const cls=['c']; if(sameDay(d,t)) cls.push('today'); if(lb.hol) cls.push('hol'); if(d.getDay()===0) cls.push('sun');
    head+= filterCat ? `<div class="c"><div class="w">星期${WD[d.getDay()]}</div></div>` :
      `<div class="${cls.join(' ')}" data-date="${ymd(d)}"><div class="w">${WD[d.getDay()]}</div><div class="d">${d.getDate()}</div><div class="l">${settings.lunar||lb.hol?esc(lb.t):''}</div></div>`;
    let evs=eventsOn(d); if(filterCat) evs=evs.filter(e=>e.cat===filterCat);
    all+=`<div class="col" data-date="${ymd(d)}">${evs.filter(e=>e.allDay).map(e=>barHTML(e,d)).join('')}</div>`;
    const laid=layoutDay(evs);
    let inner = laid.map(it=>{
      const top=(it.s/60-startH)*H, h=Math.max((it.en-it.s)/60*H-2,20), w=100/it.n;
      const k=catOf(it.e.cat), c=k.c;
      return `<div class="ev" style="--c:${c};--f:${k.f};top:${top}px;height:${h}px;left:calc(${w*it.col}% + 1px);width:calc(${w}% - 3px)" data-id="${it.e.id}" data-eid="${it.e.id}" data-date="${ymd(d)}">
        <div class="t">${it.e.kind==='milestone'?'◆':''}${esc(it.e.title)}</div>${h>34?`<div class="s">${it.e.start}${it.e.location&&h>50?' · '+esc(it.e.location):''}</div>`:''}</div>`;
    }).join('');
    if(sameDay(d,t) && !filterCat){ const now=new Date(), mm=now.getHours()*60+now.getMinutes(); if(mm>=startH*60) inner+=`<div class="nowline" style="top:${(mm/60-startH)*H}px"></div>`; }
    body+=`<div class="col ${sameDay(d,t)&&!filterCat?'today':''}" data-date="${ymd(d)}" style="height:${(endH-startH)*H}px">${inner}</div>`;
  });
  const showAll = days.some(d=>eventsOn(d).some(e=>e.allDay && (!filterCat||e.cat===filterCat)));
  return `<div class="card tg-wrap"><div class="tg-head" style="grid-template-columns:${cols}">${head}</div>
    ${showAll?`<div class="allday" style="grid-template-columns:${cols}">${all}</div>`:''}
    <div class="tg-scroll"><div class="tg" style="grid-template-columns:${cols}"><div class="hours">${hours}</div>${body}</div></div></div>
    ${n===1?`<div class="card agenda">${agendaHTML(cur)}</div>`:''}`;
}
function ttHTML(){
  const tc=CATS.find(c=>c.id===settings.ttCat); return gridHTML(7, tc?tc.id:'__none__') + `<div class="hint" style="padding:0 6px">${tc?`課表顯示「${esc(tc.name)}」分類的行程。新增時選這個分類並設定每週重複，就會出現在這裡。`:'請到 ⚙︎ 設定 → 分類管理，選擇課表要顯示哪個分類。'}可以在設定的「分類管理」更換。</div>`;
}
function listHTML(){
  const t=today(); let html='', lastM=-1, cnt=0;
  for(let i=0;i<90;i++){
    const d=addDays(t,i), evs=eventsOn(d); if(!evs.length) continue;
    if(d.getMonth()!==lastM){ html+=`<div class="mh">${d.getFullYear()} · ${MN[d.getMonth()]}月</div>`; lastM=d.getMonth(); }
    const h=holiday(d);
    html+=`<div class="dh ${i===0?'today':''}"><span class="n">${d.getDate()}</span><span class="w">${i===0?'今天 · ':i===1?'明天 · ':''}星期${WD[d.getDay()]}　${settings.lunar?lunar(d).text:''}</span>${h?`<span class="h">${h}</span>`:''}</div>`;
    html+=evs.map(e=>itemHTML(e,d)).join(''); cnt++;

/* ========= 待辦 ========= */
let tdDue=null, showDone=false;
function dueText(x){
  if(!x.due) return '';
  const d=parse(x.due), n=diffDays(today(),d);
  const rel = x.done?'':(n<0?`逾期 ${-n} 天`:n===0?'今天':n===1?'明天':`還有 ${n} 天`);
  return `📅 ${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）${x.time?' '+x.time:''}${rel?' · '+rel:''}`;
}
function todoItemHTML(x){
  const n = x.due?diffDays(today(),parse(x.due)):null;
  const cls = x.done?'':(n!==null&&n<0?'over':n===0?'today':'');
  return `<div class="td ${x.done?'done':''}" data-tid="${x.id}"><button class="ck ${x.done?'on':''}" aria-label="完成"></button>
    <div class="tx"><div class="tt">${esc(x.text)}</div>${x.due?`<div class="due ${cls}">${dueText(x)}</div>`:''}${x.note?`<div class="note">${esc(x.note)}</div>`:''}</div></div>`;
}
function todoHTML(){
  const t=ymd(today()), open=todos.filter(x=>!x.done), done=todos.filter(x=>x.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  const byDue=(a,b)=>(a.due+(a.time||'99')).localeCompare(b.due+(b.time||'99'))||a.created-b.created;
  const over=open.filter(x=>x.due&&x.due<t).sort(byDue), tod=open.filter(x=>x.due===t).sort(byDue),
        up=open.filter(x=>x.due&&x.due>t).sort(byDue), none=open.filter(x=>!x.due).sort((a,b)=>a.created-b.created);
  const sec=(title,arr,red)=>arr.length?`<div class="td-sec ${red?'red':''}">${title}<span class="n">${arr.length}</span></div>${arr.map(todoItemHTML).join('')}`:'';
  return `<div class="todo-add"><div class="row1"><span class="plus"></span><input class="q" id="tdInput" placeholder="寫下待辦，按 Enter 加入" enterkeyhint="done" autocomplete="off"><button class="addbtn" id="tdAdd">加入</button></div>
    <div class="dl-chips" id="dlChips"><span class="lab">期限</span>${chipsHTML()}</div></div>
    <div class="card todo-list">${(over.length+tod.length+up.length+none.length)?'':'<div class="empty">沒有待辦事項，太棒了</div>'}
      ${sec('已逾期',over,true)}${sec('今天',tod)}${sec('接下來',up)}${sec('沒有期限',none)}
      ${done.length?`<button class="td-more" id="tdDoneTg">${showDone?'隱藏':'顯示'}已完成（${done.length}）</button>${showDone?done.map(todoItemHTML).join(''):''}`:''}
    </div>`;
}
const isQuick = v => v===ymd(today()) || v===ymd(addDays(today(),1));
function chipsHTML(){
  const T=ymd(today()), M=ymd(addDays(today(),1));
  const picked = tdDue && tdDue!==T && tdDue!==M;
  return `<button data-dl="none" class="${!tdDue?'on':''}">無期限</button><button data-dl="${T}" class="${tdDue===T?'on':''}">今天</button><button data-dl="${M}" class="${tdDue===M?'on':''}">明天</button>
    <button data-dl="pick" class="${picked?'on':''}">${picked?(()=>{const d=parse(tdDue);return `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`;})():'選日期'}</button>
    <input type="date" id="dlPick" value="${tdDue||''}" style="${picked?'':'display:none'}">`;

function bindChips(){

    if(v==='pick'){ const p=$('#dlPick'); p.style.display=''; if(!tdDue) tdDue=ymd(addDays(today(),2)); p.value=tdDue; try{p.showPicker&&p.showPicker();}catch(e){} }

function addTodo(){
  const inp=$('#tdInput'), text=inp.value.trim(); if(!text){ inp.focus(); return; }
  todos.push({id:uid(),text,due:tdDue,time:'',note:'',done:false,created:Date.now()}); saveTodos();

function toggleTodo(id){

function saveDraft(){
  const d=draft;
  d.title=$('#fTitle').value.trim(); if(!d.title){ toast('請輸入標題'); $('#fTitle').focus(); return; }
  d.date=$('#fDate').value||d.date; d.start=$('#fStart').value; d.end=$('#fEnd').value;
  if(!d.allDay && !d.start){ toast('請輸入開始時間，或改成全天'); return; }
  if(!d.allDay && d.end && d.end<d.start) d.end=d.start;
  lastCat=d.cat; d.location=$('#fLoc').value.trim(); d.note=$('#fNote').value.trim(); d.remind=+$('#fRem').value;
  d.repeat.until=$('#fUntil')?$('#fUntil').value||null:null;
  if(d.repeat.type==='weekly' && !(d.repeat.days&&d.repeat.days.length)) d.repeat.days=[parse(d.date).getDay()];
  if(d.id){ const i=events.findIndex(e=>e.id===d.id); delete d.demo; events[i]=d; }
  else { d.id=uid(); events.push(d); }
  save(); closeSheet(); sel=parse(editingDate&&occursOn(d,parse(editingDate))?editingDate:d.date);
  if(view==='month' && sel.getMonth()!==cur.getMonth()) cur=new Date(sel.getFullYear(),sel.getMonth(),1);

}

function notiState(){ if(!('Notification' in window)) return '請先加入主畫面'; return {granted:'已開啟',denied:'已封鎖（到系統設定開啟）',default:'開啟'}[Notification.permission]; }
async function requestNoti(){ if(!('Notification' in window)){ toast('iPhone 請先用 Safari「加入主畫面」再開啟通知'); return; } try{ await Notification.requestPermission(); }catch(e){} }
let askedNoti = load('hizi.askedNoti',false);
function askNotifyOnce(d){ if(askedNoti || d.remind<0 || !('Notification' in window) || Notification.permission!=='default') return; askedNoti=true; try{localStorage.setItem('hizi.askedNoti','true');}catch(e){} requestNoti(); }
async function notify(title, body){
  toast(`🔔 ${title}　${body}`, 6000);
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  try{ const reg = await navigator.serviceWorker?.getRegistration(); if(reg) reg.showNotification(title,{body,icon:'icon-192.png',tag:title+body}); else new Notification(title,{body}); }catch(e){}
}
function checkReminders(){
  const now=new Date(), fired=load(FKEY,{});
  [0,1].forEach(off=>{ const d=addDays(today(),off);
    eventsOn(d).forEach(e=>{
      if(e.remind==null||e.remind<0) return;
      const base = new Date(d); if(e.allDay) base.setHours(9,0,0,0); else { const m=toMin(e.start); base.setHours(Math.floor(m/60),m%60,0,0); }
      const at = new Date(base.getTime()-e.remind*60000), k=e.id+'@'+ymd(d);
      if(now>=at && now-at<6*3600000 && !fired[k]){ fired[k]=1; notify(e.title, e.allDay?`${d.getMonth()+1}/${d.getDate()} 全天`:`${d.getMonth()+1}/${d.getDate()} ${e.start}${e.location?' · '+e.location:''}`); }
    });
  });
  todos.forEach(x=>{ if(x.done||!x.due||!x.time) return; const [h,m]=x.time.split(':').map(Number); const at=parse(x.due); at.setHours(h,m,0,0); const k='td'+x.id+'@'+x.due;
    if(now>=at && now-at<6*3600000 && !fired[k]){ fired[k]=1; notify('待辦到期：'+x.text, `${x.due.slice(5).replace('-','/')} ${x.time}`); } });
  const cut=ymd(addDays(today(),-3)); Object.keys(fired).forEach(k=>{ if(k.split('@')[1]<cut) delete fired[k]; });
  try{ localStorage.setItem(FKEY,JSON.stringify(fired)); }catch(e){}
}

/* ========= 拖曳移動行程 ========= */
const DRAG={on:false,el:null};
let justDragged=false;
const fmtMin = m => pad(Math.floor(m/60))+':'+pad(m%60);
const hourPx = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hour'));
function dragWait(el,x,y,isTouch){
  clearTimeout(DRAG.timer);
  Object.assign(DRAG,{el,sx:x,sy:y,isTouch,on:false,target:null});
  if(isTouch) DRAG.timer=setTimeout(()=>beginDrag(x,y),380);   // 手機：長按 0.38 秒開始拖
}
function beginDrag(x,y){
  const el=DRAG.el; if(!el||!document.body.contains(el)) return;
  const ev=events.find(e=>e.id===el.dataset.eid); if(!ev) return;
  const r=el.getBoundingClientRect();
  Object.assign(DRAG,{on:true,ev,from:el.dataset.date,mode:el.classList.contains('ev')?'time':'day',offX:x-r.left,offY:y-r.top,
    dur:Math.max(toMin(ev.end||ev.start)-toMin(ev.start),0)});
  const g=el.cloneNode(true); g.classList.add('drag-ghost');
  Object.assign(g.style,{width:r.width+'px',height:r.height+'px',left:r.left+'px',top:r.top+'px',margin:0});
  document.body.appendChild(g); DRAG.ghost=g; el.classList.add('drag-src'); document.body.classList.add('dragging');
  if(navigator.vibrate) navigator.vibrate(12);
  moveDrag(x,y); requestAnimationFrame(autoScroll);
}
function clearDropUI(){ document.querySelectorAll('.drop-cell').forEach(c=>c.classList.remove('drop-cell')); document.querySelectorAll('.drop-slot').forEach(c=>c.remove()); }
function moveDrag(x,y){
  DRAG.lx=x; DRAG.ly=y;
  DRAG.ghost.style.left=(x-DRAG.offX)+'px'; DRAG.ghost.style.top=(y-DRAG.offY)+'px';
  clearDropUI(); DRAG.target=null;
  const t=document.elementFromPoint(x,y); if(!t) return;
  if(DRAG.mode==='day'){
    const cell=t.closest('.mcell, .allday .col[data-date]'); if(!cell) return;
    cell.classList.add('drop-cell'); DRAG.target={date:cell.dataset.date};
  } else {
    const col=t.closest('.tg .col[data-date]'); if(!col) return;
    const H=hourPx(), top=col.getBoundingClientRect().top;
    let m=Math.round((6*60+((y-DRAG.offY)-top)/H*60)/15)*15;   // 以 15 分鐘為單位對齊
    m=Math.max(6*60,Math.min(m,24*60-15));
    DRAG.target={date:col.dataset.date,min:m};
    const slot=document.createElement('div'); slot.className='drop-slot';
    slot.style.top=((m/60-6)*H)+'px'; slot.style.height=Math.max(DRAG.dur/60*H-2,20)+'px';
    slot.textContent=fmtMin(m)+(DRAG.dur?' – '+fmtMin(Math.min(m+DRAG.dur,23*60+59)):'');
    col.appendChild(slot);
  }
}
function autoScroll(){   // 拖到邊緣時自動捲動
  if(!DRAG.on) return;
  const y=DRAG.ly, edge=50, sp=9; let moved=false;
  const sc = DRAG.mode==='time' ? document.querySelector('.tg-scroll') : null;
  if(sc){ const r=sc.getBoundingClientRect(); if(y<r.top+edge&&sc.scrollTop>0){sc.scrollTop-=sp;moved=true;} else if(y>r.bottom-edge){sc.scrollTop+=sp;moved=true;} }
  else { const bottom=innerHeight-70; if(y<edge&&scrollY>0){scrollBy(0,-sp);moved=true;} else if(y>bottom-edge){scrollBy(0,sp);moved=true;} }
  if(moved) moveDrag(DRAG.lx,DRAG.ly);
  requestAnimationFrame(autoScroll);
}
function endDrag(cancel){
  clearTimeout(DRAG.timer);
  if(!DRAG.on){ DRAG.el=null; return; }
  DRAG.on=false; justDragged=true; setTimeout(()=>justDragged=false,400);
  DRAG.ghost.remove(); DRAG.el.classList.remove('drag-src'); document.body.classList.remove('dragging'); clearDropUI();
  const t=cancel?null:DRAG.target, ev=DRAG.ev; DRAG.el=null;
  if(!t) return;
  let start=ev.start, end=ev.end;
  if(DRAG.mode==='time'){ start=fmtMin(t.min); end=fmtMin(Math.min(t.min+DRAG.dur,23*60+59)); }
  if(t.date===DRAG.from && start===ev.start) return;
  applyMove(ev,DRAG.from,t.date,start,end);
}
let lastMove=null;
function applyMove(ev,from,to,start,end){
  lastMove = JSON.stringify(events);
  const rec = ev.repeat && ev.repeat.type!=='none';
  if(rec){   // 重複行程：只移動這一次
    ev.ex=[...(ev.ex||[]),from];
    const c=JSON.parse(JSON.stringify(ev)); c.id=uid(); c.repeat={type:'none'}; delete c.ex;
    Object.assign(c,{date:to,start,end}); events.push(c);
  } else Object.assign(ev,{date:to,start,end});
  save(); sel=parse(to); render();
  const d=parse(to);
  toastUndo(`已移到 ${d.getMonth()+1}/${d.getDate()}${ev.allDay?'':' '+start}${rec?'（只移這一次）':''}`);
}
function toastUndo(msg){
  const t=$('#toast'); t.innerHTML=`${esc(msg)}<button id="undoBtn" style="color:#8DB8FF;margin-left:14px;pointer-events:auto">復原</button>`; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),4500);
  $('#undoBtn').onclick=()=>{ if(lastMove){ events=JSON.parse(lastMove); lastMove=null; save(); render(); } t.classList.remove('on'); };
}
document.addEventListener('touchstart',e=>{ const el=e.target.closest('[data-eid]'); if(!el||e.touches.length>1){ return; } const p=e.touches[0]; dragWait(el,p.clientX,p.clientY,true); },{passive:true});
document.addEventListener('touchmove',e=>{
  if(!DRAG.el) return; const p=e.touches[0];
  if(DRAG.on){ e.preventDefault(); moveDrag(p.clientX,p.clientY); }
  else if(Math.hypot(p.clientX-DRAG.sx,p.clientY-DRAG.sy)>8){ clearTimeout(DRAG.timer); DRAG.el=null; }   // 手指在移動 = 捲動畫面
},{passive:false});
document.addEventListener('touchend',e=>{ if(DRAG.on) e.preventDefault(); endDrag(); },{passive:false});
document.addEventListener('touchcancel',()=>endDrag(true));
document.addEventListener('mousedown',e=>{ if(e.button!==0) return; const el=e.target.closest('[data-eid]'); if(el) dragWait(el,e.clientX,e.clientY,false); });
document.addEventListener('mousemove',e=>{ if(!DRAG.el||DRAG.isTouch) return; if(DRAG.on) moveDrag(e.clientX,e.clientY); else if(Math.hypot(e.clientX-DRAG.sx,e.clientY-DRAG.sy)>6) beginDrag(e.clientX,e.clientY); });
document.addEventListener('mouseup',()=>{ if(!DRAG.isTouch) endDrag(); });
document.addEventListener('click',e=>{ if(justDragged && !e.target.closest('#toast')){ e.stopPropagation(); e.preventDefault(); } },true);
document.addEventListener('contextmenu',e=>{ if(e.target.closest('[data-eid]')) e.preventDefault(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') endDrag(true); });

/* ========= 介面互動 ========= */
function openSheet(){ $('#mask').classList.add('on'); $('#sheet').classList.add('on'); $('#sheet').scrollTop=0; }
function closeSheet(){ $('#mask').classList.remove('on'); $('#sheet').classList.remove('on'); }
let toastT; function toast(m,ms=1800){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),ms); }

$('#mask').onclick=closeSheet;
$('#prev').onclick=e=>{e.stopPropagation(); shift(-1);};
$('#next').onclick=e=>{e.stopPropagation(); shift(1);};
$('#todayBtn').onclick=()=>{ cur=today(); sel=today(); if(view==='month') cur=new Date(cur.getFullYear(),cur.getMonth(),1); render(); };
$('#addBtn').onclick=()=>{ if(view==='todo'){ const i=$('#tdInput'); if(i){ i.focus(); i.scrollIntoView({block:'center'}); } else openTodoEditor(null); return; } openEditor(null, ymd(view==='day'?cur:sel)); };
$('#themeBtn').onclick=()=>{ settings.theme = isDark()?'light':'dark'; save(); applyTheme(); toast(isDark()?'已切換為深色':'已切換為淺色'); };
$('#setBtn').onclick=openSettings;
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{ if(b.dataset.v==='day') cur=new Date(sel); if(b.dataset.v==='week') cur=new Date(sel); if(b.dataset.v==='month'){ cur=new Date(sel.getFullYear(),sel.getMonth(),1);} setView(b.dataset.v); });
$('#cdStrip').addEventListener('click',e=>{ const c=e.target.closest('.cd'); if(c) openEditor(c.dataset.id,c.dataset.date); });

// 左右滑動換頁
let tx=null, ty=null;
$('#main').addEventListener('touchstart',e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; },{passive:true});
$('#main').addEventListener('touchend',e=>{ if(tx===null) return; if(DRAG.on||justDragged){ tx=null; return; } const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty; if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5 && view!=='list' && view!=='tt' && view!=='todo') shift(dx<0?1:-1); tx=null; },{passive:true});
let lastW=innerWidth; addEventListener('resize',()=>{ if(Math.abs(innerWidth-lastW)>50){ lastW=innerWidth; render(); } });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ render(); checkReminders(); } });

if(view==='month') cur=new Date(cur.getFullYear(),cur.getMonth(),1);
render();
checkReminders(); setInterval(checkReminders, 30000);
setInterval(()=>{ if(view==='day'||view==='week') { const sc=$('.tg-scroll'), st=sc?sc.scrollTop:0; render(); const s2=$('.tg-scroll'); if(s2) s2.scrollTop=st; } }, 300000);
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
